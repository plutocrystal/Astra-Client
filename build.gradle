plugins {
    id 'java'
    id "com.github.johnrengelman.shadow" version '8.1.1'
}

group = 'dev.astra'

def versionFromSettings = gradle.ext.mod_version
version = versionFromSettings

repositories {
    mavenCentral()
}

dependencies {
    implementation fileTree(dir: 'libs/minecraft', includes: ['*.jar'])
}

sourceSets {
    main {
        java {
            srcDir "$buildDir/generated/source/version/main/java"
        }
    }
}

task generateVersionClass {
    def outputDir = file("$buildDir/generated/source/version/main/java/astra")
    def versionFile = file("$outputDir/Version.java")
    outputs.dir outputDir
    doLast {
        outputDir.mkdirs()
        versionFile.text = """
package dev.astra;

public final class Version {
    public static final String VERSION = "${versionFromSettings}";
    private Version() {}
}
"""
    }
}

compileJava {
    dependsOn generateVersionClass
}

jar {
    archiveFileName = "Astra.jar"
    manifest {
    }
    from(zipTree('libs/minecraft/ViaVersion-5.11.0-downgraded.jar'))
    from(zipTree('libs/minecraft/ViaRewind-4.1.3-downgraded.jar'))
    from(zipTree('libs/minecraft/ViaBackwards-5.11.0-downgraded.jar'))
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

shadowJar {
    archiveFileName = "Astra-All.jar"
    configurations = [project.configurations.runtimeClasspath]
}

tasks.build {
    dependsOn shadowJar
}

tasks.register('runClient', JavaExec) {
    mainClass = 'Start'
    classpath = sourceSets.test.runtimeClasspath
    jvmArgs = ['-Djava.library.path=natives/']
    workingDir = file('run/')
}