-dontshrink
-dontoptimize
-dontwarn **
-keepattributes *Annotation*,Signature,InnerClasses,EnclosingMethod,Deprecated
-printmapping build/libs/mapping.txt

# Everything outside dev.astra keeps its original names (vanilla, Via, etc.)
-keep class !dev.astra.** { *; }

# Modules are loaded reflectively by scanning dev/astra/module/impl (ModuleManager)
-keep class dev.astra.module.impl.** { *; }

# Event handler methods are invoked reflectively by name (EventBus)
-keepclasseswithmembers class dev.astra.** {
    @dev.astra.event.EventHandler <methods>;
}

# LWJGL 2->3 compatibility shim: keep all API surface classes
-keep class org.lwjgl.** { *; }
-keep class org.lwjgl.opengl.** { *; }
-keep class org.lwjgl.input.** { *; }
-keep class org.lwjgl.util.** { *; }
-keep class org.lwjgl.glfw.** { *; }
-keep class org.lwjgl.openal.** { *; }

# LWJGL 3 core: keep native methods and memory access
-keep class org.lwjgl.system.** { *; }
-keep class org.lwjgl.BufferUtils { *; }

# Keep GL entry points for OpenGL bindings
-keepclasseswithmembers class org.lwjgl.opengl.GL* {
    native <methods>;
}
-keepclasseswithmembers class org.lwjgl.opengl.ARB* {
    native <methods>;
}
-keepclasseswithmembers class org.lwjgl.opengl.EXT* {
    native <methods>;
}
